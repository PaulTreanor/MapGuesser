<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebSocket Test</title>
    <style>
        body {
            font-family: monospace;
            max-width: 800px;
            margin: 50px auto;
            padding: 20px;
        }
        #messages {
            border: 1px solid #ccc;
            height: 400px;
            overflow-y: auto;
            padding: 10px;
            margin: 20px 0;
            background: #f5f5f5;
        }
        .message {
            margin: 5px 0;
            padding: 5px;
            background: white;
            border-radius: 3px;
        }
        .message.sent {
            background: #e3f2fd;
        }
        .message.received {
            background: #fff3e0;
        }
        .message.system {
            background: #f3e5f5;
        }
        button {
            padding: 10px 20px;
            margin: 5px;
            cursor: pointer;
        }
        input {
            padding: 10px;
            width: 300px;
        }
        .status {
            padding: 10px;
            margin: 10px 0;
            border-radius: 5px;
        }
        .status.connected {
            background: #c8e6c9;
        }
        .status.disconnected {
            background: #ffcdd2;
        }
    </style>
</head>
<body>
    <h1>WebSocket Test - GameRoom</h1>

    <div>
        <label>Game Code:
            <input type="text" id="gameCode" value="TEST123" placeholder="Enter game code">
        </label>
        <button id="connect">Connect</button>
        <button id="disconnect">Disconnect</button>
    </div>

    <div id="status" class="status disconnected">Disconnected</div>

    <div>
        <input type="text" id="messageInput" placeholder="Type a message..." disabled>
        <button id="send" disabled>Send</button>
    </div>

    <div id="messages"></div>

    <script>
        let ws = null;
        const messagesDiv = document.getElementById('messages');
        const statusDiv = document.getElementById('status');
        const gameCodeInput = document.getElementById('gameCode');
        const messageInput = document.getElementById('messageInput');
        const connectBtn = document.getElementById('connect');
        const disconnectBtn = document.getElementById('disconnect');
        const sendBtn = document.getElementById('send');

        function addMessage(text, type = 'received') {
            const div = document.createElement('div');
            div.className = `message ${type}`;
            div.textContent = `[${new Date().toLocaleTimeString()}] ${text}`;
            messagesDiv.appendChild(div);
            messagesDiv.scrollTop = messagesDiv.scrollHeight;
        }

        function updateStatus(connected) {
            if (connected) {
                statusDiv.textContent = 'Connected';
                statusDiv.className = 'status connected';
                messageInput.disabled = false;
                sendBtn.disabled = false;
                connectBtn.disabled = true;
                disconnectBtn.disabled = false;
            } else {
                statusDiv.textContent = 'Disconnected';
                statusDiv.className = 'status disconnected';
                messageInput.disabled = true;
                sendBtn.disabled = true;
                connectBtn.disabled = false;
                disconnectBtn.disabled = true;
            }
        }

        connectBtn.addEventListener('click', () => {
            const gameCode = gameCodeInput.value.trim().toUpperCase();
            if (!gameCode) {
                alert('Please enter a game code');
                return;
            }

            addMessage(`Connecting to game ${gameCode}...`, 'system');

            // Connect to WebSocket
            ws = new WebSocket(`ws://localhost:8788/ws/${gameCode}`);

            ws.onopen = () => {
                addMessage('WebSocket connection opened', 'system');
                updateStatus(true);
            };

            ws.onmessage = (event) => {
                try {
                    const data = JSON.parse(event.data);
                    addMessage(`Received: ${JSON.stringify(data, null, 2)}`, 'received');
                } catch (e) {
                    addMessage(`Received: ${event.data}`, 'received');
                }
            };

            ws.onclose = (event) => {
                addMessage(`Connection closed: ${event.code} - ${event.reason}`, 'system');
                updateStatus(false);
            };

            ws.onerror = (error) => {
                addMessage(`WebSocket error: ${error}`, 'system');
                console.error('WebSocket error:', error);
            };
        });

        disconnectBtn.addEventListener('click', () => {
            if (ws) {
                ws.close();
                ws = null;
            }
        });

        sendBtn.addEventListener('click', () => {
            const message = messageInput.value.trim();
            if (!message) return;

            const data = {
                type: 'test_message',
                content: message,
                timestamp: Date.now()
            };

            ws.send(JSON.stringify(data));
            addMessage(`Sent: ${message}`, 'sent');
            messageInput.value = '';
        });

        messageInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                sendBtn.click();
            }
        });
    </script>
</body>
</html>
